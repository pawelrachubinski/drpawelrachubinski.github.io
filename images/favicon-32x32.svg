<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100">

  <!-- Weißer Hintergrund -->
  <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>

  <!-- Optisch zentrierte, etwas größere Krupp-Ringe -->
  <g transform="translate(50 50)">
    <!-- oberer Ring -->
    <circle cx="0" cy="-14" r="18"
            fill="none"
            stroke="#000000"
            stroke-width="4"/>

    <!-- linker Ring -->
    <circle cx="-14" cy="7" r="18"
            fill="none"
            stroke="#000000"
            stroke-width="4"/>

    <!-- rechter Ring -->
    <circle cx="14" cy="7" r="18"
            fill="none"
            stroke="#000000"
            stroke-width="4"/>
  </g>

</svg>
